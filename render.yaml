# render.yaml — place this in the ROOT of your repository.
# Render will auto-detect it and configure your backend service.

services:
  - type: web
    name: medtrack-backend
    runtime: node
    rootDir: backend          # tells Render to cd into /backend
    buildCommand: npm install
    startCommand: npm start
    plan: free                # change to "starter" etc. if needed
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Set these manually in the Render dashboard (do NOT put secrets here):
      - key: MONGO_URI
        sync: false           # Render will prompt you to fill this in
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false           # your GitHub Pages URL
